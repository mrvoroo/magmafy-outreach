# One VPS, one container + a reverse proxy with automatic HTTPS. Secrets come from deploy/.env (chmod 600, never committed).
services:
  outreach:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes: ["outreach-data:/data"]
    environment: { ADMIN_PORT: "8080" }
    expose: ["8080"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 60s, timeout: 5s, retries: 3 }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
    depends_on: [outreach]
volumes: { outreach-data: {}, caddy-data: {} }
